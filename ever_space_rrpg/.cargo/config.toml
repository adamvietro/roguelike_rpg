# Forces winit (via bracket-terminal) to use X11 instead of Wayland.
#
# Why: on Wayland, bracket-terminal's window creation goes through
# sctk-adwaita's title-bar text renderer (crossfont/freetype), which hits
# an "unsafe precondition violated" panic on some toolchains/setups
# (e.g. WSLg defaulting to Wayland). Forcing X11 skips that renderer
# entirely and avoids the crash.
#
# This must live here, in .cargo/config.toml - Cargo.toml's [env] table is
# NOT a recognized manifest key (Cargo just warns and ignores it), so this
# setting silently did nothing when it lived in Cargo.toml.
[env]
WINIT_UNIX_BACKEND = "x11"